<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="techGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <filter id="screenShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff"/>
  
  <!-- Support technician workstation -->
  <g transform="translate(150, 100)">
    <!-- Monitor -->
    <rect x="0" y="0" width="120" height="80" rx="4" fill="url(#techGradient)" filter="url(#screenShadow)"/>
    <rect x="5" y="5" width="110" height="70" rx="2" fill="url(#screenGradient)"/>
    
    <!-- Screen content - network diagram -->
    <g opacity="0.7">
      <circle cx="30" cy="25" r="8" fill="#38bdf8"/>
      <circle cx="60" cy="25" r="8" fill="#38bdf8"/>
      <circle cx="90" cy="25" r="8" fill="#38bdf8"/>
      <line x1="30" y1="25" x2="60" y2="25" stroke="#059669" stroke-width="2"/>
      <line x1="60" y1="25" x2="90" y2="25" stroke="#059669" stroke-width="2"/>
      
      <rect x="20" y="45" width="80" height="20" rx="2" fill="#FEC556" opacity="0.3"/>
      <text x="60" y="58" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#0D1B32">SYSTEM ONLINE</text>
    </g>
    
    <!-- Stand -->
    <rect x="50" y="80" width="20" height="40" fill="#64748b"/>
    <rect x="40" y="120" width="40" height="8" fill="#64748b"/>
  </g>
  
  <!-- Customer device -->
  <g transform="translate(350, 120)">
    <!-- Laptop -->
    <rect x="0" y="0" width="100" height="60" rx="3" fill="#0D1B32" opacity="0.8"/>
    <rect x="5" y="5" width="90" height="50" rx="2" fill="url(#screenGradient)"/>
    
    <!-- Happy customer indicator -->
    <circle cx="50" cy="30" r="15" fill="#059669" opacity="0.2"/>
    <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#059669">✓</text>
    
    <!-- Keyboard -->
    <rect x="10" y="65" width="80" height="6" rx="2" fill="#64748b"/>
  </g>
  
  <!-- Connection indicator -->
  <g>
    <line x1="270" y1="140" x2="350" y2="150" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>
    <circle cx="310" cy="145" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Data packets -->
    <circle cx="280" cy="142" r="2" fill="#FEC556">
      <animate attributeName="cx" values="270;350;270" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="145" r="2" fill="#059669">
      <animate attributeName="cx" values="270;350;270" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="148" r="2" fill="#38bdf8">
      <animate attributeName="cx" values="270;350;270" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Professional indicators -->
  <g transform="translate(50, 250)">
    <rect x="0" y="0" width="12" height="12" fill="#059669"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="12" fill="#64748b">24/7 Technical Support</text>
  </g>
  
  <g transform="translate(50, 280)">
    <rect x="0" y="0" width="12" height="12" fill="#38bdf8"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Remote Assistance</text>
  </g>
  
  <g transform="translate(50, 310)">
    <rect x="0" y="0" width="12" height="12" fill="#FEC556"/>
    <text x="18" y="10" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Expert Technicians</text>
  </g>
  
  <!-- Status badges -->
  <g transform="translate(400, 250)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#059669" opacity="0.1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#059669">ISSUE RESOLVED</text>
  </g>
  
  <g transform="translate(400, 290)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#38bdf8" opacity="0.1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#38bdf8">REMOTE DIAGNOSTIC</text>
  </g>
  
  <g transform="translate(400, 330)">
    <rect x="0" y="0" width="120" height="30" rx="15" fill="#FEC556" opacity="0.1"/>
    <text x="60" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FDB840">PREVENTIVE MAINTENANCE</text>
  </g>
</svg>

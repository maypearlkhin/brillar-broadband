<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="professionalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B32;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a3a52;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Main network backbone -->
  <rect x="100" y="195" width="600" height="10" rx="5" fill="url(#professionalGradient)"/>
  
  <!-- Network nodes -->
  <g id="node">
    <circle r="15" fill="#0D1B32" filter="url(#glow)"/>
    <circle r="8" fill="#38bdf8"/>
    <circle r="3" fill="#ffffff"/>
  </g>
  
  <!-- Place nodes along backbone -->
  <use href="#node" x="150" y="200"/>
  <use href="#node" x="300" y="200"/>
  <use href="#node" x="500" y="200"/>
  <use href="#node" x="650" y="200"/>
  
  <!-- Connection lines to clients -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
    <line x1="150" y1="200" x2="150" y2="120"/>
    <line x1="300" y1="200" x2="300" y2="100"/>
    <line x1="500" y1="200" x2="500" y2="130"/>
    <line x1="650" y1="200" x2="650" y2="110"/>
  </g>
  
  <!-- Client buildings -->
  <g fill="#0D1B32" opacity="0.8">
    <rect x="130" y="80" width="40" height="40" rx="2"/>
    <rect x="280" y="60" width="40" height="40" rx="2"/>
    <rect x="480" y="90" width="40" height="40" rx="2"/>
    <rect x="630" y="70" width="40" height="40" rx="2"/>
  </g>
  
  <!-- Data flow animation -->
  <g>
    <rect x="145" y="198" width="10" height="4" fill="url(#dataFlow)">
      <animate attributeName="y" values="198;180;198" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="295" y="198" width="10" height="4" fill="url(#dataFlow)">
      <animate attributeName="y" values="198;160;198" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="495" y="198" width="10" height="4" fill="url(#dataFlow)">
      <animate attributeName="y" values="198;190;198" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="645" y="198" width="10" height="4" fill="url(#dataFlow)">
      <animate attributeName="y" values="198;170;198" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Professional labels -->
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#0D1B32">Enterprise Fiber Network</text>
  <text x="400" y="270" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748b">High-Speed Connectivity Solutions</text>
  
  <!-- Status indicators -->
  <g transform="translate(50, 320)">
    <circle cx="0" cy="0" r="4" fill="#059669"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Active</text>
  </g>
  
  <g transform="translate(150, 320)">
    <circle cx="0" cy="0" r="4" fill="#059669"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Connected</text>
  </g>
  
  <g transform="translate(250, 320)">
    <circle cx="0" cy="0" r="4" fill="#FEC556"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Optimized</text>
  </g>
</svg>
